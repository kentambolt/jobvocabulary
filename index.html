<!doctype html>
<html lang="da">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Topwords</title>
  <meta name="description" content="Lær de mest brugte ord – ét ord ad gangen.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@500;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="top">
    <button class="brand" id="homeBtn" aria-label="Topwords">Top<span>words</span></button>
    <div class="score" id="score" hidden>
      <span class="score-num" id="scoreNum">0</span>
      <span class="score-label" id="scoreLabel"></span>
      <span class="score-delta" id="scoreDelta"></span>
    </div>
    <nav class="nav">
      <button class="icon-btn" id="statsBtn" title="Statistik" aria-label="Statistik" hidden><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 20V11M12 20V5M19 20v-6" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/></svg></button>
      <button class="icon-btn" id="setupBtn" title="Indstillinger" aria-label="Indstillinger" hidden><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h10M18 7h2M4 17h4M12 17h8" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/><circle cx="16" cy="7" r="2.3" fill="none" stroke="currentColor" stroke-width="2.2"/><circle cx="10" cy="17" r="2.3" fill="none" stroke="currentColor" stroke-width="2.2"/></svg></button>
    </nav>
  </header>
  <main id="app"></main>
  <script src="words.js"></script>
  <script src="packs/cleaning.js"></script>
  <script src="app.js"></script>
</body>
</html>
