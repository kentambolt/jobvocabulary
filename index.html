<!DOCTYPE html>
<html lang="da" translate="no">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<!-- notranslate: browser auto-translation would replace the text we are testing on -->
<meta name="google" content="notranslate">
<title>Traffic Words</title>
<style>
  :root {
    --bg: #ffffff;
    --text: #1a1a2e;
    --muted: #8a8fa3;
    --border: #e8eaf0;
    --accent: #3b5bdb;
    --green: #2f9e44;
    --green-bg: #ebfbee;
    --red: #e03131;
    --red-bg: #fff5f5;
    --btn-bg: #f8f9fb;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    min-height: 100dvh;
    display: flex;
    flex-direction: column;
  }
  header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 14px 18px;
    border-bottom: 1px solid var(--border);
  }
  header .title { font-size: 15px; font-weight: 600; letter-spacing: 0.3px; color: var(--muted); }
  #settingsBtn {
    background: none; border: none; cursor: pointer; padding: 6px;
    color: var(--muted); display: flex; align-items: center;
  }
  #settingsBtn svg { width: 22px; height: 22px; }

  main {
    flex: 1;
    display: flex;
    flex-direction: column;
    justify-content: center;
    max-width: 480px;
    width: 100%;
    margin: 0 auto;
    padding: 20px 18px 30px;
  }
  #promptLabel {
    text-align: center;
    font-size: 13px;
    color: var(--muted);
    margin-bottom: 14px;
    text-transform: uppercase;
    letter-spacing: 0.8px;
  }
  #question {
    text-align: center;
    font-size: 26px;
    font-weight: 700;
    line-height: 1.35;
    margin-bottom: 34px;
    min-height: 70px;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  #question.sentence { font-size: 20px; font-weight: 600; }
  #question.empty { font-size: 16px; font-weight: 500; color: var(--muted); }

  #options { display: flex; flex-direction: column; gap: 12px; }
  .option {
    width: 100%;
    text-align: left;
    padding: 15px 18px;
    font-size: 17px;
    line-height: 1.4;
    background: var(--btn-bg);
    border: 1.5px solid var(--border);
    border-radius: 14px;
    cursor: pointer;
    color: var(--text);
    transition: background 0.12s, border-color 0.12s, transform 0.06s;
    font-family: inherit;
  }
  .option:active { transform: scale(0.985); }
  .option.correct {
    background: var(--green-bg);
    border-color: var(--green);
    color: var(--green);
    font-weight: 600;
  }
  @keyframes pop {
    0% { transform: scale(1); }
    35% { transform: scale(1.045); }
    100% { transform: scale(1); }
  }
  .option.correct.chosen { animation: pop 0.35s ease; }
  @keyframes shake {
    0%, 100% { transform: translateX(0); }
    25% { transform: translateX(-5px); }
    75% { transform: translateX(5px); }
  }
  .option.wrong { animation: shake 0.3s ease; }
  .option.wrong {
    background: var(--red-bg);
    border-color: var(--red);
    color: var(--red);
  }
  .option.dim { opacity: 0.45; }
  .option.done { cursor: default; }

  #feedback {
    text-align: center;
    margin-top: 22px;
    min-height: 26px;
    font-size: 16px;
    font-weight: 600;
    opacity: 0;
    transition: opacity 0.15s;
  }
  #feedback.show { opacity: 1; }
  #feedback.ok { color: var(--green); }
  #feedback.bad { color: var(--red); }

  @keyframes hintPulse {
    0%, 100% { opacity: 0.45; }
    50% { opacity: 1; }
  }
  #continueHint {
    text-align: center;
    margin-top: 10px;
    font-size: 14px;
    color: var(--muted);
    min-height: 20px;
    visibility: hidden;
  }
  #continueHint.show {
    visibility: visible;
    animation: hintPulse 1.6s ease-in-out infinite;
  }

  #loadError {
    text-align: center;
    color: var(--red);
    font-size: 15px;
    line-height: 1.5;
    padding: 20px;
    display: none;
  }

  /* Settings panel */
  #overlay {
    position: fixed; inset: 0;
    background: rgba(20, 20, 40, 0.35);
    opacity: 0; pointer-events: none;
    transition: opacity 0.2s;
    z-index: 10;
  }
  #overlay.open { opacity: 1; pointer-events: auto; }
  #panel {
    position: fixed;
    left: 0; right: 0; bottom: 0;
    background: var(--bg);
    border-radius: 20px 20px 0 0;
    padding: 22px 20px calc(26px + env(safe-area-inset-bottom));
    transform: translateY(105%);
    transition: transform 0.25s ease;
    z-index: 11;
    max-width: 480px;
    margin: 0 auto;
    box-shadow: 0 -8px 30px rgba(0,0,0,0.12);
    max-height: 85vh;
    overflow-y: auto;
  }
  #panel.open { transform: translateY(0); }
  #panel h2 { font-size: 18px; margin-bottom: 18px; }
  .setting { margin-bottom: 18px; }
  .setting label {
    display: block;
    font-size: 13px;
    color: var(--muted);
    margin-bottom: 8px;
    text-transform: uppercase;
    letter-spacing: 0.6px;
  }
  .seg {
    display: flex;
    flex-wrap: wrap;
    background: var(--btn-bg);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 3px;
    gap: 3px;
  }
  .seg button {
    flex: 1;
    min-width: 90px;
    border: none;
    background: transparent;
    padding: 10px 4px;
    font-size: 15px;
    border-radius: 9px;
    cursor: pointer;
    color: var(--muted);
    font-family: inherit;
    transition: background 0.12s, color 0.12s;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 7px;
  }
  .seg .flag {
    display: inline-flex;
    flex-shrink: 0;
    width: 22px;
    height: 16px;
    border-radius: 3px;
    overflow: hidden;
    box-shadow: 0 0 0 1px rgba(0,0,0,0.12);
  }
  .seg .flag svg { width: 100%; height: 100%; display: block; }
  .seg button.active {
    background: #fff;
    color: var(--accent);
    font-weight: 600;
    box-shadow: 0 1px 4px rgba(0,0,0,0.08);
  }
  #closePanel {
    width: 100%;
    margin-top: 6px;
    padding: 14px;
    font-size: 16px;
    font-weight: 600;
    background: var(--accent);
    color: #fff;
    border: none;
    border-radius: 12px;
    cursor: pointer;
    font-family: inherit;
  }
</style>
</head>
<body>

<header>
  <div class="title" id="appTitle">Traffic Words</div>
  <button id="settingsBtn" aria-label="Settings">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="12" cy="12" r="3"></circle>
      <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"></path>
    </svg>
  </button>
</header>

<main>
  <div id="loadError"></div>
  <div id="promptLabel"></div>
  <div id="question"></div>
  <div id="options"></div>
  <div id="feedback"></div>
  <div id="continueHint"></div>
</main>

<div id="overlay"></div>
<div id="panel">
  <h2 id="sTitle"></h2>
  <div class="setting">
    <label id="lDeck"></label>
    <div class="seg" id="segDeck"></div>
  </div>
  <div class="setting">
    <label id="lUi"></label>
    <div class="seg" id="segUi"></div>
  </div>
  <div class="setting">
    <label id="lQ"></label>
    <div class="seg" id="segQ"></div>
  </div>
  <div class="setting">
    <label id="lA"></label>
    <div class="seg" id="segA"></div>
  </div>
  <div class="setting">
    <label id="lMode"></label>
    <div class="seg" id="segMode"></div>
  </div>
  <div class="setting">
    <label id="lTopic"></label>
    <div class="seg" id="segTopic"></div>
  </div>
  <button id="closePanel"></button>
</div>

<script>
// All language-specific content lives in languages.json:
//   languages: { code: "Native name", ... }
//   ui:        { code: { UI strings }, ... }
//   decks:     { deckId: { name:       { code: "Deck name", ... },
//                          categories: { catId: { code: "Label", ... }, ... },
//                          words:      [ { cat: "catId", code: "translation", ... }, ... ],
//                          sentences:  [ { code: "translation", ... }, ... ] }, ... }
// To add a language: add it to "languages" and "ui", and add its code as a key
// on each word/sentence. To add a subject: add a new deck. To add a word topic:
// add it to that deck's "categories" and tag its words with the id. The app
// picks all of it up automatically.
const DATA_URL = "languages.json";

let DATA = null;
let LANGS = [];
let DECKS = [];

// ---------------- SETTINGS ----------------
// Settings live in three places, in increasing priority:
//   1. DEFAULTS
//   2. localStorage (STORE_KEY, with a one-time read of the legacy keys)
//   3. the URL hash, e.g. #d=hospital&ui=ru&q=da&a=ru&m=words&t=all
// The hash wins because it is explicit — it also means a home-screen shortcut
// or a bookmark carries the settings even if the browser clears localStorage
// (iOS evicts site data after ~7 days of not visiting, which used to make the
// app come back with the default languages).
const DEFAULTS = { deck: "traffic", uiLang: "ru", qLang: "en", aLang: "ru", mode: "words", topic: "all" };
const STORE_KEY = "trafficWordsSettings";
const LEGACY_STORE_KEYS = ["teoriTrainerSettings"];
const HASH_KEYS = { d: "deck", ui: "uiLang", q: "qLang", a: "aLang", m: "mode", t: "topic" };

let settings = { ...DEFAULTS };

function readStored() {
  try {
    let raw = localStorage.getItem(STORE_KEY);
    if (raw === null) {
      // Migrate from an older build. Only read the legacy key when the current
      // one is absent, and delete it on the next save so the two keys can never
      // disagree again.
      for (const key of LEGACY_STORE_KEYS) {
        const legacy = localStorage.getItem(key);
        if (legacy !== null) { raw = legacy; break; }
      }
    }
    const parsed = raw ? JSON.parse(raw) : null;
    return parsed && typeof parsed === "object" ? parsed : null;
  } catch (e) { return null; }
}

function readHash() {
  try {
    const raw = location.hash.replace(/^#/, "");
    if (!raw) return null;
    const params = new URLSearchParams(raw);
    const out = {};
    for (const [short, key] of Object.entries(HASH_KEYS)) {
      if (params.has(short)) out[key] = params.get(short);
    }
    return Object.keys(out).length ? out : null;
  } catch (e) { return null; }
}

settings = { ...DEFAULTS, ...(readStored() || {}), ...(readHash() || {}) };

function writeHash() {
  try {
    const params = new URLSearchParams();
    for (const [short, key] of Object.entries(HASH_KEYS)) params.set(short, settings[key]);
    const hash = "#" + params.toString();
    if (location.hash !== hash) history.replaceState(null, "", hash);
  } catch (e) {}
}

function saveSettings(opts) {
  const withHash = !opts || opts.hash !== false;
  try {
    localStorage.setItem(STORE_KEY, JSON.stringify(settings));
    LEGACY_STORE_KEYS.forEach(key => localStorage.removeItem(key));
  } catch (e) {}
  if (withHash) writeHash();
}

function validateSettings() {
  // Fall back gracefully if a saved value no longer exists in the JSON.
  if (!DECKS.includes(settings.deck)) settings.deck = DECKS.includes(DEFAULTS.deck) ? DEFAULTS.deck : DECKS[0];
  if (!LANGS.includes(settings.uiLang)) settings.uiLang = LANGS.includes(DEFAULTS.uiLang) ? DEFAULTS.uiLang : LANGS[0];
  if (!LANGS.includes(settings.qLang)) settings.qLang = LANGS.includes(DEFAULTS.qLang) ? DEFAULTS.qLang : LANGS[0];
  if (!LANGS.includes(settings.aLang)) settings.aLang = LANGS.includes(DEFAULTS.aLang) ? DEFAULTS.aLang : LANGS[0];
  if (!["words", "sentences", "both"].includes(settings.mode)) settings.mode = DEFAULTS.mode;
  // Topics belong to a deck, so switching deck resets an unknown topic.
  if (settings.topic !== "all" && !deck().categories[settings.topic]) settings.topic = "all";
}

function deck() { return DATA.decks[settings.deck] || DATA.decks[DECKS[0]]; }

// UI strings with fallback to English for missing keys/languages
function T(key) {
  const ui = DATA.ui[settings.uiLang] || DATA.ui.en || {};
  return ui[key] ?? (DATA.ui.en || {})[key] ?? key;
}

function localized(obj) {
  if (!obj) return "";
  return obj[settings.uiLang] ?? obj.en ?? Object.values(obj)[0] ?? "";
}

// ---------------- QUIZ LOGIC ----------------
let lastItem = null;
let answered = false;
let advanceTimer = null;

function pool() {
  const d = deck();
  // topic filter applies to words only; sentences are always included
  const words = settings.topic === "all"
    ? d.words
    : d.words.filter(w => w.cat === settings.topic);
  let items;
  if (settings.mode === "words") items = words;
  else if (settings.mode === "sentences") items = d.sentences;
  else items = words.concat(d.sentences);
  // only items translated in both selected languages
  return items.filter(it => it[settings.qLang] && it[settings.aLang]);
}

function pick(arr) { return arr[Math.floor(Math.random() * arr.length)]; }

function shuffle(arr) {
  for (let i = arr.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [arr[i], arr[j]] = [arr[j], arr[i]];
  }
  return arr;
}

function newQuestion() {
  clearTimeout(advanceTimer);
  answered = false;

  const qEl = document.getElementById("question");
  const optEl = document.getElementById("options");
  const fb = document.getElementById("feedback");
  fb.className = "";
  fb.textContent = "";
  document.getElementById("continueHint").className = "";

  const p = pool();
  if (p.length < 4) {
    // Say so instead of silently leaving the previous question on screen.
    qEl.className = "empty";
    qEl.textContent = T("notEnough");
    optEl.innerHTML = "";
    return;
  }

  let item = pick(p);
  while (p.length > 1 && item === lastItem) item = pick(p);
  lastItem = item;

  const qText = item[settings.qLang];
  const aText = item[settings.aLang];

  // distractors: 3 unique wrong answers in the answer language
  const wrongs = [];
  const seen = new Set([aText]);
  let guard = 0;
  while (wrongs.length < 3 && guard++ < 300) {
    const cand = pick(p)[settings.aLang];
    if (!seen.has(cand)) { seen.add(cand); wrongs.push(cand); }
  }

  const options = shuffle([aText, ...wrongs]);

  qEl.textContent = qText;
  qEl.className = deck().sentences.includes(item) ? "sentence" : "";

  optEl.innerHTML = "";
  options.forEach(text => {
    const btn = document.createElement("button");
    btn.className = "option";
    btn.textContent = text;
    btn.onclick = e => {
      if (answered) return; // let the click bubble to the tap-to-continue handler
      e.stopPropagation(); // don't let the answering click instantly advance
      answer(btn, text === aText, aText);
    };
    optEl.appendChild(btn);
  });
}

function answer(btn, isCorrect, correctText) {
  if (answered) return;
  answered = true;

  const fb = document.getElementById("feedback");
  const buttons = document.querySelectorAll(".option");

  buttons.forEach(b => {
    b.classList.add("done"); // kept enabled so taps on them can advance to the next question
    if (b.textContent === correctText) {
      b.classList.add("correct");
      if (b === btn) b.classList.add("chosen");
    }
    else if (b === btn) b.classList.add("wrong");
    else b.classList.add("dim");
  });

  if (isCorrect) {
    // correct: quick pop animation, then advance automatically
    fb.textContent = T("correct");
    fb.className = "show ok";
    advanceTimer = setTimeout(newQuestion, 700);
  } else {
    // wrong: no auto-advance — the user taps anywhere when ready
    fb.textContent = T("wrong");
    fb.className = "show bad";
    document.getElementById("continueHint").textContent = T("tapToContinue");
    document.getElementById("continueHint").className = "show";
  }
}

// tap anywhere to skip the waiting time after answering
document.addEventListener("click", e => {
  if (answered && !e.target.closest("#panel") && !e.target.closest("#settingsBtn") && !e.target.closest("#overlay")) {
    newQuestion();
  }
});

// ---------------- SETTINGS UI ----------------
// Inline SVG flags — Unicode emoji flags render as plain letter codes on
// Windows, so we use SVGs that work on every platform (PC, Android, iOS).
// To add a language, add its code here with a small SVG of its flag.
const FLAGS = {
  en: '<svg viewBox="0 0 60 30" preserveAspectRatio="none" aria-hidden="true"><rect width="60" height="30" fill="#012169"/><path d="M0,0 L60,30 M60,0 L0,30" stroke="#fff" stroke-width="6"/><path d="M0,0 L60,30 M60,0 L0,30" stroke="#C8102E" stroke-width="3.6"/><path d="M30,0 V30 M0,15 H60" stroke="#fff" stroke-width="10"/><path d="M30,0 V30 M0,15 H60" stroke="#C8102E" stroke-width="6"/></svg>',
  ru: '<svg viewBox="0 0 60 30" preserveAspectRatio="none" aria-hidden="true"><rect width="60" height="10" fill="#fff"/><rect y="10" width="60" height="10" fill="#0039A6"/><rect y="20" width="60" height="10" fill="#D52B1E"/></svg>',
  da: '<svg viewBox="0 0 37 28" preserveAspectRatio="none" aria-hidden="true"><rect width="37" height="28" fill="#C8102E"/><rect x="12" width="4" height="28" fill="#fff"/><rect y="12" width="37" height="4" fill="#fff"/></svg>'
};

function buildSeg(containerId, values, labels, key, withFlags) {
  const el = document.getElementById(containerId);
  el.innerHTML = "";
  values.forEach((v, i) => {
    const b = document.createElement("button");
    if (withFlags && FLAGS[v]) {
      const f = document.createElement("span");
      f.className = "flag";
      f.innerHTML = FLAGS[v];
      b.appendChild(f);
    }
    const t = document.createElement("span");
    t.textContent = labels[i];
    b.appendChild(t);
    if (settings[key] === v) b.classList.add("active");
    b.onclick = () => {
      settings[key] = v;
      validateSettings(); // e.g. a topic from the previous deck
      saveSettings();
      renderSettings();
      renderTexts();
      newQuestion();
    };
    el.appendChild(b);
  });
}

function renderSettings() {
  const langLabels = LANGS.map(l => DATA.languages[l] || l);
  const uiLangs = LANGS.filter(l => DATA.ui[l]); // UI only in languages that have UI strings
  buildSeg("segDeck", DECKS, DECKS.map(d => localized(DATA.decks[d].name)), "deck");
  buildSeg("segUi", uiLangs, uiLangs.map(l => DATA.languages[l] || l), "uiLang", true);
  buildSeg("segQ", LANGS, langLabels, "qLang", true);
  buildSeg("segA", LANGS, langLabels, "aLang", true);
  buildSeg("segMode", ["words", "sentences", "both"], [T("words"), T("sentences"), T("both")], "mode");
  const catIds = Object.keys(deck().categories || {});
  buildSeg("segTopic", ["all", ...catIds],
    [T("all"), ...catIds.map(c => localized(deck().categories[c]) || c)], "topic");
}

function renderTexts() {
  document.getElementById("appTitle").textContent = localized(deck().name);
  document.getElementById("promptLabel").textContent = T("prompt");
  document.getElementById("sTitle").textContent = T("settings");
  document.getElementById("lDeck").textContent = T("deck");
  document.getElementById("lUi").textContent = T("uiLang");
  document.getElementById("lQ").textContent = T("qLang");
  document.getElementById("lA").textContent = T("aLang");
  document.getElementById("lMode").textContent = T("mode");
  document.getElementById("lTopic").textContent = T("topic");
  document.getElementById("closePanel").textContent = T("close");
  document.documentElement.lang = settings.uiLang;
}

const panel = document.getElementById("panel");
const overlay = document.getElementById("overlay");
function openPanel() { panel.classList.add("open"); overlay.classList.add("open"); }
function closePanel() { panel.classList.remove("open"); overlay.classList.remove("open"); }
document.getElementById("settingsBtn").onclick = e => { e.stopPropagation(); openPanel(); };
document.getElementById("closePanel").onclick = closePanel;
overlay.onclick = closePanel;

// ---------------- INIT ----------------
fetch(DATA_URL)
  .then(r => {
    if (!r.ok) throw new Error("HTTP " + r.status);
    return r.json();
  })
  .then(json => {
    DATA = json;
    LANGS = Object.keys(DATA.languages);
    DECKS = Object.keys(DATA.decks);
    validateSettings();
    // Write the validated settings back straight away: that puts them under the
    // current key and clears the legacy one, so an older cached copy of the page
    // can no longer resurrect stale languages. Leave the URL alone on a clean
    // load; only keep an existing hash in sync.
    saveSettings({ hash: location.hash.length > 1 });
    renderTexts();
    renderSettings();
    newQuestion();
  })
  .catch(err => {
    const el = document.getElementById("loadError");
    el.style.display = "block";
    el.textContent = "Could not load languages.json — the app must be opened from a web server (not directly from a file). / Не удалось загрузить languages.json — откройте приложение через веб-сервер.";
    console.error(err);
  });
</script>
</body>
</html>
