plugins { id 'com.android.application' }

android {
    namespace 'com.jobvocabulary.android'
    compileSdk 36
    buildToolsVersion '36.0.0'
    defaultConfig {
        // Proposed identity. Do not upload before the release identity is confirmed.
        applicationId 'com.jobvocabulary.app'
        minSdk 26
        targetSdk 36
        versionCode = (project.findProperty('jvVersionCode') ?: '1').toInteger()
        versionName = project.findProperty('jvVersionName') ?: '1.0.0'
    }
    signingConfigs {
        debug {
            storeFile rootProject.file('.keys/test.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
        if (System.getenv('JV_ANDROID_KEYSTORE')) {
            release {
                storeFile file(System.getenv('JV_ANDROID_KEYSTORE'))
                storePassword System.getenv('JV_ANDROID_STORE_PASSWORD')
                keyAlias System.getenv('JV_ANDROID_KEY_ALIAS')
                keyPassword System.getenv('JV_ANDROID_KEY_PASSWORD')
            }
        }
    }
    buildTypes {
        debug {
            applicationIdSuffix '.qa'
            versionNameSuffix '-qa'
            resValue 'string', 'app_name', 'JobVocabulary QA'
        }
        release {
            minifyEnabled false
            if (System.getenv('JV_ANDROID_KEYSTORE')) signingConfig signingConfigs.release
        }
    }
}

dependencies {
    implementation 'com.google.androidbrowserhelper:androidbrowserhelper:2.7.4'
}
